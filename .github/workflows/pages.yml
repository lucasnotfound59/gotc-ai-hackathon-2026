name: Publish event website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Validate source and scoring API
        run: |
          node --check app.js
          node --check platform.js
          node --check platform-admin.js
          node --test tests/*.test.mjs
          python -B scripts/check_site.py
          python -B -m unittest discover -s server -p 'test_*.py'
      - name: Stage public files
        run: |
          mkdir _site
          cp index.html styles.css app.js favicon.svg _site/
          cp -r assets downloads _site/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
